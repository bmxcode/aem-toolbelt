<svg xmlns="http://www.w3.org/2000/svg" width="820" height="360" viewBox="0 0 820 360" font-family="-apple-system, 'Segoe UI', Roboto, sans-serif">
  <style>
    .t{fill:#2b2b2b}.muted{fill:#707070}.link{fill:#1473e6}
    .mono{font-family:'SF Mono',Menlo,Consolas,monospace}
  </style>
  <rect width="820" height="360" fill="#fafafa"/>

  <!-- header -->
  <text x="24" y="42" font-size="26" class="t">Select Folder(s)</text>

  <!-- buttons -->
  <g font-size="13">
    <rect x="470" y="24" width="104" height="30" rx="15" fill="#fff" stroke="#b3b3b3"/>
    <text x="522" y="43" text-anchor="middle" class="t">Open Folder</text>
    <rect x="586" y="24" width="74" height="30" rx="15" fill="#fff" stroke="#b3b3b3"/>
    <text x="623" y="43" text-anchor="middle" class="t">Cancel</text>
    <rect x="672" y="24" width="84" height="30" rx="15" fill="#1473e6" opacity="0.45"/>
    <text x="714" y="43" text-anchor="middle" fill="#fff">Remove</text>
  </g>

  <!-- banner: what's being removed -->
  <text x="24" y="82" font-size="14"><tspan class="t">Removing Schema </tspan><tspan class="t mono" font-weight="700">product-schema</tspan></text>

  <!-- folder card 1 (selected) -->
  <g>
    <rect x="24" y="100" width="220" height="150" rx="4" fill="#33373d" stroke="#1473e6" stroke-width="2"/>
    <rect x="38" y="114" width="18" height="18" rx="2" fill="#1473e6"/>
    <text x="42" y="128" font-size="12" fill="#fff">✓</text>
    <text x="40" y="150" font-size="13" fill="#ffffff" font-weight="700">Spring Campaign</text>
    <text x="40" y="167" font-size="11" fill="#c9c9c9">FOLDER</text>
    <rect x="86" y="176" width="96" height="44" rx="6" fill="none" stroke="#2f56c9" stroke-width="3"/>
    <rect x="24" y="228" width="220" height="22" fill="#f4f4f4"/>
    <text x="24" y="270" font-size="12" class="mono muted">/content/dam/marketing/</text>
    <text x="24" y="285" font-size="12" class="mono muted">campaigns/spring</text>
  </g>

  <!-- folder card 2 -->
  <g>
    <rect x="268" y="100" width="220" height="150" rx="4" fill="#33373d" stroke="#e0e0e0"/>
    <rect x="282" y="114" width="18" height="18" rx="2" fill="#fff" stroke="#8a8a8a"/>
    <text x="284" y="150" font-size="13" fill="#ffffff" font-weight="700">Brand Logos</text>
    <text x="284" y="167" font-size="11" fill="#c9c9c9">FOLDER</text>
    <rect x="330" y="176" width="96" height="44" rx="6" fill="none" stroke="#2f56c9" stroke-width="3"/>
    <rect x="268" y="228" width="220" height="22" fill="#f4f4f4"/>
    <text x="268" y="270" font-size="12" class="mono muted">/content/dam/brand/logos</text>
  </g>
</svg>
