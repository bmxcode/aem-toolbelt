<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      body {
        width: 260px;
        margin: 0;
        padding: 14px;
        font: 13px -apple-system, "Segoe UI", Roboto, sans-serif;
        color: #222;
      }
      h1 { font-size: 14px; margin: 0 0 4px; }
      p { margin: 0 0 10px; color: #666; }
      code { word-break: break-all; color: #1473e6; }
      button {
        width: 100%;
        padding: 8px;
        border: 0;
        border-radius: 6px;
        background: #1473e6;
        color: #fff;
        font-size: 13px;
        cursor: pointer;
      }
      button:disabled { background: #b8b8b8; cursor: default; }
      .status { margin-top: 10px; color: #2b8a3e; }
    </style>
  </head>
  <body>
    <h1>AEM Toolbelt 🧰</h1>
    <p>
      Runs automatically on <code>*.adobeaemcloud.com</code> and
      <code>localhost:4502</code>. For other AEM hosts (AMS / on-prem), enable it here.
    </p>
    <p>This site: <code id="host">—</code></p>
    <button id="enable" disabled>Enable on this site</button>
    <div class="status" id="status"></div>
    <script src="popup.js"></script>
  </body>
</html>
